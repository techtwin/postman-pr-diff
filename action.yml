name: Postman PR Diff
description: Summarize semantic request-level changes to Postman Collection v2.1 files in pull requests.
author: techtwin
inputs:
  github-token:
    description: "GitHub token with contents: read and pull-requests: write permission."
    required: true
  collection-file-suffix:
    description: Only files whose current or previous name ends with this suffix are evaluated.
    required: false
    default: .postman_collection.json
  comment-marker:
    description: Stable HTML marker used to find and update the pull request comment.
    required: false
    default: postman-pr-diff
  url-display:
    description: "URL detail level in reports: path-only (default), full, or hidden."
    required: false
    default: path-only
runs:
  using: node20
  main: dist/index.js
